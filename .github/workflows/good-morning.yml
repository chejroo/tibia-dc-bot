name: Good morning

on:
  schedule:
    # 08:00 Europe/Warsaw is 06:00 UTC in summer and 07:00 UTC in winter.
    # Both runs start 30 min early; the script picks the right one and waits.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: "Send immediately (test)"
        type: boolean
        default: true
      message:
        description: "Message for this run only (empty = the daily one)"
        type: string
        default: ""
      gif_query:
        description: "Also send a Tenor GIF for this search, like /gif query:hello (empty = none)"
        type: string
        default: ""

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python good_morning.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
          MESSAGE: ${{ inputs.message || vars.GOOD_MORNING_MESSAGE }}
          GIF_QUERY: ${{ inputs.gif_query || vars.GIF_QUERY }}
          SCHEDULE: ${{ github.event.schedule }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.send_now && 'true' || 'false' }}
